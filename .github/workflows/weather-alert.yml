name: Weather Alert Bot

on:
  schedule:
    # Runs every 20 minutes.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      force_alert:
        description: "Send a test alert using real forecast data (does not update alert_state.json)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weather alert bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_ALERT: ${{ github.event.inputs.force_alert || 'false' }}
        run: python weather_alert.py

      - name: Commit updated alert_state.json if changed
        run: |
          if ! git diff --quiet -- alert_state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add alert_state.json
            git commit -m "Update alert_state.json [skip ci]"
            git push
          else
            echo "No changes to alert_state.json."
          fi
